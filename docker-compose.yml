services:
  postgres:
    image: postgres:17-alpine
    container_name: wantnot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wantnot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wantnot-app
    ports:
      - "5050:5050"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wantnot
      SESSION_SECRET: local-dev-secret-change-in-prod
      NODE_ENV: production
      PORT: "5050"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    driver: local